services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory_postgres
    restart: always
    # Жестко ограничиваем память, которую Postgres забирает под свои нужды
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    mem_limit: 256m       # Максимум реальной RAM
    memswap_limit: 1024m  # RAM + Swap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: always
    ports:
      - "6379:6379"
    # Ограничиваем кэш Redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis_data:/data
    mem_limit: 128m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: inventory_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    # Qdrant любит память для векторных индексов. Ограничиваем, остальное пойдет в Swap
    mem_limit: 512m
    memswap_limit: 1536m

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: inventory_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      GOMEMLIMIT: 256MiB # Критично важно для ограничения памяти Go-приложений
    ports:
      - "9010:9000" # API
      - "9011:9001" # Console (UI)
    volumes:
      - ./data/minio_data:/data
    mem_limit: 512m
    memswap_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Автоматическая инициализация бакета
  minio-init:
    image: minio/mc:latest
    container_name: inventory_minio_init
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 256m
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-};
      /usr/bin/mc mb myminio/inventory-media --ignore-existing;
      /usr/bin/mc anonymous set download myminio/inventory-media;
      exit 0;
      "

  db_migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_db_migrator
    command: ["python", "scripts/migrate_admin.py"]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy