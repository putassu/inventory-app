name: inventarizator

x-app: &app
  build: .
  image: inventarizator:local
  env_file: .env.local
  environment:
    INV_DATABASE_URL: postgresql+asyncpg://inventory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/inventory
    INV_REDIS_URL: redis://redis:6379/0
    INV_QDRANT_URL: http://qdrant:6333
    INV_S3_ENDPOINT: http://minio:9000
    INV_S3_ACCESS_KEY: inventory
    INV_S3_SECRET_KEY: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
    INV_OLLAMA_URL: http://host.docker.internal:11434
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  volumes: ["backups:/app/data/backups"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: inventory
    command: postgres -c shared_buffers=32MB -c max_connections=50 -c work_mem=2MB
    mem_limit: 256m
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 32mb --maxmemory-policy noeviction --save "" --appendonly no
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.18.0
    mem_limit: 192m
    volumes: ["qdrant:/qdrant/storage"]
    environment: {QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: 8}
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    command: server /data
    environment:
      MINIO_ROOT_USER: inventory
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
      GOMEMLIMIT: 128MiB
    mem_limit: 192m
    volumes: ["media:/data"]
    restart: unless-stopped
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  cpu:
    <<: *app
    command: python -m app.cli worker cpu
    mem_limit: 256m
  ml:
    <<: *app
    command: python -m app.cli worker ml
    mem_limit: 256m
  scheduler:
    <<: *app
    command: python -m app.cli worker scheduler
    mem_limit: 160m
  cloud:
    <<: *app
    profiles: [cloud]
    command: python -m app.cli worker cloud
    mem_limit: 192m
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    mem_limit: 32m
    restart: unless-stopped

volumes:
  postgres:
  media:
  qdrant:
  backups:
