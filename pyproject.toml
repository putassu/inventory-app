[project]
name = "inventarizator"
version = "1.0.0"
description = "Личный учёт вещей с обязательным подтверждением AI"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "argon2-cffi>=23,<26", "arq>=0.26,<0.27",
  "asyncpg>=0.29,<1", "boto3>=1.35,<2", "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1", "jinja2>=3.1,<4", "pillow>=11,<13",
  "pydantic-settings>=2.6,<3", "pyjwt>=2.9,<3", "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.18,<1", "qdrant-client>=1.14,<2",
  "sqlalchemy>=2.0.36,<2.1", "uvicorn>=0.32,<1", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["aiosqlite>=0.20", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9", "mypy>=1.14", "types-python-dateutil"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/contract"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app/domain", "app/settings"]
