# /pool01/ronzhin_lv/inventory/docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_backend
    restart: always
    ports:
      - "9005:9005"
    env_file:
      - .env # Здесь лежат креды к БД, MinIO и S3_ENDPOINT
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully

  db_migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_db_migrator
    command: ["python", "scripts/migrate_admin.py"]
    env_file:
      - .env # Здесь лежат креды к БД
    environment:
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: inventory_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
    volumes:
      - /pool01/ronzhin_lv/inventory/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /pool01/ronzhin_lv/inventory/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: inventory_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - /pool01/ronzhin_lv/inventory/qdrant_data:/qdrant/storage


  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: inventory_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "9010:9000" # API
      - "9011:9001" # Console (UI)
    volumes:
      - /pool01/ronzhin_lv/inventory/minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Автоматическая инициализация бакета для файлов
  minio-init:
    image: minio/mc:latest
    container_name: inventory_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-};
      /usr/bin/mc mb myminio/inventory-media --ignore-existing;
      /usr/bin/mc anonymous set download myminio/inventory-media;
      exit 0;
      "

  worker_high_priority:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_worker_high
    restart: always
    command: ["python", "-m", "arq", "backend.app.services.worker.WorkerSettings"]
    env_file:
      - .env-server
    environment:
      - ARQ_QUEUE_NAME=high_priority
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_default:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_worker_default
    restart: always
    command: ["python", "-m", "arq", "backend.app.services.worker.WorkerSettings"]
    env_file:
      - .env-server
    environment:
      - ARQ_QUEUE_NAME=default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_bulk:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_worker_bulk
    restart: always
    command: ["python", "-m", "arq", "backend.app.services.worker.WorkerSettings"]
    env_file:
      - .env-server
    environment:
      - ARQ_QUEUE_NAME=bulk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inventory_scheduler
    restart: always
    command: ["python", "-m", "arq", "backend.app.services.worker.WorkerSettings"]
    env_file:
      - .env-server
    environment:
      - ARQ_QUEUE_NAME=cron_only
      - ARQ_ENABLE_CRON=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  asr:
    build:
      context: ./asr
      dockerfile: Dockerfile
    container_name: inventory_asr
    restart: always
    ports:
      # Пробрасываем 8007 порт (по VPN будешь стучаться на 10.0.245.10:8007)
      - "8007:8007"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]